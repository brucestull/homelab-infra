---
- name: Deploy the Pi-hole + Unbound DNS stack
  hosts: dns_servers
  become: true
  gather_facts: true
  tasks:
    - name: Create the dns-stack directory structure
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/docker/dns-stack/{{ item }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"
      loop:
        - ""
        - unbound
        - etc-pihole
        - etc-dnsmasq.d

    - name: Copy the static dns-stack files (identical on every host)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../dns-stack/{{ item.src }}"
        dest: "/home/{{ ansible_user }}/docker/dns-stack/{{ item.dest }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"
      loop:
        - { src: "docker-compose.yml", dest: "docker-compose.yml" }
        - { src: "unbound/unbound.conf", dest: "unbound/unbound.conf" }

    - name: Template the .env file (per-host IP + vaulted password)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/dns-stack.env.j2"
        dest: "/home/{{ ansible_user }}/docker/dns-stack/.env"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"

    - name: Bring up the dns-stack with docker compose
      community.docker.docker_compose_v2:
        project_src: "/home/{{ ansible_user }}/docker/dns-stack"
        state: present
      become: false
